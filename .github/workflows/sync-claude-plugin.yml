name: Sync claude-plugin mirror

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - ".github/claude-plugin-README.md"
      - "genudo-plugin/**"
      - ".github/workflows/sync-claude-plugin.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The public mirror ships ONE plugin (`genudo`). The root manifest also lists
      # `genudo-no-connector`, which is internal-only (team machines add
      # genudo-ai/genudo_mcp as the `genudo-ai` marketplace to get it) — filter it out.
      - name: Assemble mirror
        run: |
          set -euo pipefail
          mkdir -p mirror/.claude-plugin
          jq '.plugins |= map(select(.name == "genudo"))' .claude-plugin/marketplace.json \
            > mirror/.claude-plugin/marketplace.json
          test "$(jq '.plugins | length' mirror/.claude-plugin/marketplace.json)" = 1
          cp -R genudo-plugin mirror/
          cp .github/claude-plugin-README.md mirror/README.md

      - name: Push to genudo-ai/claude-plugin
        env:
          DEPLOY_KEY: ${{ secrets.CLAUDE_PLUGIN_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cd mirror
          git init -b main
          git config user.name "genudo-ai"
          git config user.email "help@genudo.ai"
          git add -A
          git commit -m "Sync from genudo_mcp@${GITHUB_SHA::7}"
          git push --force git@github.com:genudo-ai/claude-plugin.git main
