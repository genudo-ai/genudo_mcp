name: Sync chatgpt-plugin mirror

on:
  push:
    branches: [main]
    paths: ["chatgpt/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push chatgpt/ to genudo-ai/chatgpt-plugin
        env:
          DEPLOY_KEY: ${{ secrets.CHATGPT_PLUGIN_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cd chatgpt
          git init -b main
          git config user.name "genudo-ai"
          git config user.email "help@genudo.ai"
          git add -A
          git commit -m "Sync from genudo_mcp@${GITHUB_SHA::7}"
          git push --force git@github.com:genudo-ai/chatgpt-plugin.git main
