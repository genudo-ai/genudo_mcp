name: Publish

# Publishes to npm and the MCP Registry when a GitHub Release is published.
# Setup required once:
#   - npm Trusted Publishing (OIDC): npmjs.com/package/genudo-mcp-client ->
#     Settings -> Trusted Publisher -> GitHub Actions -> genudo-ai/genudo_mcp,
#     workflow publish.yml. No NPM_TOKEN secret needed; OTP bypassed by design.
#   - The MCP Registry step authenticates via GitHub OIDC (no secret needed);
#     the server.json name must be io.github.<owner>/<repo>.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance + MCP Registry OIDC

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 20 bundles npm 10.
      - run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund --omit=dev
      - run: npm publish --provenance --access public

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
