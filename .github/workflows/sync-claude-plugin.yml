name: Sync claude-plugin mirror

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "genudo-plugin/**"
      - "genudo-plugin-no-connector/**"
      - ".github/workflows/sync-claude-plugin.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Claude marketplace isn't a single subtree like chatgpt/ — the manifest
      # lives at the repo root and the trees beside it — so assemble the mirror.
      - name: Assemble mirror
        run: |
          set -euo pipefail
          mkdir -p mirror/.claude-plugin
          cp .claude-plugin/marketplace.json mirror/.claude-plugin/
          cp -R genudo-plugin mirror/
          cp -R genudo-plugin-no-connector mirror/
          cp docs/claude-plugin-mirror-README.md mirror/README.md

      - name: Push to genudo-ai/claude-plugin
        env:
          DEPLOY_KEY: ${{ secrets.CLAUDE_PLUGIN_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cd mirror
          git init -b main
          git config user.name "genudo-ai"
          git config user.email "help@genudo.ai"
          git add -A
          git commit -m "Sync from genudo_mcp@${GITHUB_SHA::7}"
          git push --force git@github.com:genudo-ai/claude-plugin.git main
